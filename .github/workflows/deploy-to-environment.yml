name: Deployment To Environment - Reusable Workflow

on:
  workflow_call:
    inputs:
      branch:
        description: Branch on which the build step is happening
        required: true
        type: string
      environment:
        description: Environment in which Unavu application is being deployed
        required: true
        type: string
    secrets:
      SECRETS_YAML:
        description: YAML file with the secrets for the environment
        required: true
      KUBECONFIG_CONTENT:
        description: Base64-encoded kubeconfig for this environment's cluster
        required: true

jobs:
  Deploy_to_Environment:
    if: startsWith(github.ref, inputs.branch)
    runs-on: self-hosted
    container:
      image: ghcr.io/helmfile/helmfile:latest
      options: --user 1500:1500
      volumes:
        - /opt/ci-cache:/opt/ci-cache

    steps:
      - name: Checkout Helm charts
        uses: actions/checkout@v4
        with:
          repository: KDSCRIPT/Unavu
          ref: helm
          clean: true

      - name: Set up kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
        run: |
          mkdir -p /opt/ci-cache/.kube
          echo "$KUBECONFIG_CONTENT" | base64 -d > /opt/ci-cache/.kube/config
          chmod 600 /opt/ci-cache/.kube/config
          echo "KUBECONFIG=/opt/ci-cache/.kube/config" >> "$GITHUB_ENV"

      - name: Cache Helm chart dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            unavu-common/charts
            unavu-services/*/charts
          key: helm-charts-${{ hashFiles('unavu-common/Chart.yaml', 'unavu-services/*/Chart.yaml') }}

      - name: Update Helm dependencies
        run: |
          for d in unavu-common/ unavu-services/*/; do
            [ -d "$d" ] || continue
            echo "=== $d ==="
            if [ ! -f "${d}Chart.lock" ] || [ "${d}Chart.yaml" -nt "${d}Chart.lock" ]; then
              echo "Refreshing dependencies for $d"
              rm -f "${d}Chart.lock"
              rm -rf "${d}charts"
              for i in 1 2 3 4 5; do
                (cd "$d" && helm dependency update) && break
                echo "Retry $i/5 for $d..."
                sleep 20
              done
            else
              echo "Cache hit, skipping refetch for $d"
            fi
          done

      - name: Deploy to ${{ inputs.environment }}
        env:
          SECRETS_CONTENT: ${{ secrets.SECRETS_YAML }}
        run: |
          ENV_LOWER=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          echo "$SECRETS_CONTENT" > "./environments/secrets.${ENV_LOWER}.yaml"
          cd deploy
          helmfile -e "${ENV_LOWER}" --state-values-set IMAGE_TAG="${{ github.sha }}" sync